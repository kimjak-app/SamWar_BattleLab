name: Verify C-track refactor

on:
  push:
    branches:
      - recovery/worldmap-iso-sfx-services-20260912
      - refactor/engine-core-20260918

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Versions
        run: |
          python3 --version
          git --version
          godot --version

      - name: Verify source assets exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/audio/sfx/arrow.wav
            assets/worldmap/tiles/worldmap_tile_A1_top_left.png
            assets/source/worldmap/worldmap_master_4096x2304.png
            assets/font/noto_serif_kr/NotoSerifKR-Bold.otf
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing source asset: $path"; exit 1; }
          done

      - name: Import Godot resources and build class cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .godot
          timeout 240s godot --headless --editor --path . --import
          test -d .godot
          test -f .godot/global_script_class_cache.cfg

      - name: Static validators
        shell: bash
        run: |
          set -euo pipefail
          validators=(
            tools/validate_worldmap_main_integrity.py
            tools/validate_worldmap_diplomacy_controller_extraction.py
            tools/validate_worldmap_diplomacy_routing.py
            tools/validate_worldmap_diplomacy_service_separation.py
            tools/validate_worldmap_trade_routing.py
            tools/validate_worldmap_trade_controller_extraction.py
            tools/validate_worldmap_trade_phase2_extraction.py
            tools/validate_worldmap_spy_routing.py
            tools/validate_worldmap_spy_controller_extraction.py
            tools/validate_worldmap_battle_settlement_applier_extraction.py
            tools/validate_worldmap_t03_strategic_battle_transaction_extraction.py
            tools/validate_worldmap_t03_battle_presentation_extraction.py
            tools/validate_worldmap_player_attack_deployment_service_extraction.py
            tools/validate_worldmap_wounded_recovery_service_extraction.py
            tools/validate_worldmap_to_battle_input_lifecycle.py
            tools/validate_b0b_battle_production_skeleton.py
            tools/validate_b0c_battle_iso_promotion.py
            tools/validate_b1b_battle_movement_query_service.py
            tools/validate_b1c_battle_combat_query_service.py
            tools/validate_b1d_battle_damage_formula_service.py
            tools/validate_b1e_battle_action_lock_state_service.py
            tools/validate_b1f_battle_enemy_ai_reservation_state_service.py
            tools/validate_b1g_battle_unique_skill_cooldown_state_service.py
            tools/validate_battle_s1_1_observation_baseline.py
            tools/validate_battle_s2_1_attack_baseline.py
            tools/validate_battle_s2_2_attack_state_service.py
            tools/validate_battle_enemy_events_s3_1.py
            tools/validate_battle_tactic_events_s4_1.py
            tools/validate_battle_enemy_strategy_s4_2.py
            tools/validate_battle_s1_2_ally_move_state_service.py
            tools/validate_battle3d_m1b_engine_move.py
            tools/validate_battle3d_m2_engine_attack.py
            tools/validate_battle3d_m3_enemy_turn.py
            tools/validate_battle3d_m3b_wait.py
            tools/validate_battle3d_m4a_defend.py
            tools/validate_battle3d_m4b_strategy.py
            tools/validate_battle3d_m4d_reinforce.py
            tools/validate_battle3d_m4c1_skill.py
            tools/validate_battle3d_m4c2_enemy_skill.py
            tools/validate_battle3d_contract.py
            tools/validate_alternating_battle_action_order.py
            tools/validate_single_side_exhaustion_turn_order.py
          )
          for validator in "${validators[@]}"; do
            echo "===== $validator ====="
            python3 "$validator"
          done

      - name: C-track Godot tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/scripts/test_worldmap_city_administration_service_extraction.gd
            tests/scripts/test_worldmap_city_resource_service_extraction.gd
            tests/scripts/test_worldmap_city_detail_presentation_extraction.gd
            tests/scripts/test_worldmap_camera_controller_extraction.gd
            tests/scripts/test_worldmap_hud_controller_extraction.gd
            tests/scripts/test_worldmap_shared_ui_controller_extraction.gd
            tests/scripts/test_world_calendar_service_extraction.gd
            tests/scripts/test_world_turn_economy_service_extraction.gd
            tests/scripts/test_world_turn_state_service_extraction.gd
            tests/scripts/test_worldmap_turn_controller_extraction.gd
            tests/scripts/test_battle_movement_query_service.gd
            tests/scripts/test_battle_combat_query_service.gd
            tests/scripts/test_battle_damage_formula_service.gd
            tests/scripts/test_battle_action_lock_state_service.gd
            tests/scripts/test_battle_enemy_ai_reservation_state_service.gd
            tests/scripts/test_battle_unique_skill_cooldown_state_service.gd
            tests/scripts/test_battle_event_log_service.gd
            tests/scripts/test_battle_state_fingerprint_service.gd
            tests/scripts/test_battle_attack_oracle_shard_1.gd
            tests/scripts/test_battle_attack_oracle_shard_2.gd
            tests/scripts/test_battle_attack_state_service.gd
            tests/scripts/test_battle_attack_event_parity.gd
            tests/scripts/test_battle_enemy_event_log_service.gd
            tests/scripts/test_battle_enemy_turn_oracle_shard_1.gd
            tests/scripts/test_battle_enemy_turn_oracle_shard_2.gd
            tests/scripts/test_battle_enemy_turn_event_semantics.gd
            tests/scripts/test_battle_tactic_event_log_service.gd
            tests/scripts/test_battle_tactic_oracle_shard_1.gd
            tests/scripts/test_battle_tactic_oracle_shard_2.gd
            tests/scripts/test_battle_tactic_oracle_shard_3.gd
            tests/scripts/test_battle_tactic_oracle_shard_4.gd
            tests/scripts/test_battle_tactic_dice_hook.gd
            tests/scripts/test_battle_tactic_event_semantics.gd
            tests/scripts/test_battle_tactic_skill_semantics_shard_1.gd
            tests/scripts/test_battle_tactic_skill_semantics_shard_2.gd
            tests/scripts/test_battle_enemy_strategy_base_parity_shard_1.gd
            tests/scripts/test_battle_enemy_strategy_base_parity_shard_2.gd
            tests/scripts/test_battle_enemy_strategy_base_parity_shard_3.gd
            tests/scripts/test_battle_enemy_rules_ally_parity_shard_1.gd
            tests/scripts/test_battle_enemy_rules_ally_parity_shard_2.gd
            tests/scripts/test_battle_enemy_rules_ally_parity_shard_3.gd
            tests/scripts/test_battle_enemy_rules_ally_parity_shard_4.gd
            tests/scripts/test_battle_enemy_strategy_behavior.gd
            tests/scripts/test_battle_enemy_skill_spread_base_parity.gd
            tests/scripts/test_battle_enemy_skill_spread_behavior.gd
            tests/scripts/test_battle_enemy_tactic_rules_service.gd
            tests/scripts/test_battle_move_oracle_baseline.gd
            tests/scripts/test_battle_ally_move_state_service.gd
            tests/scripts/test_battle_ally_move_event_parity.gd
            tests/scripts/test_battle3d_engine_move_integration.gd
            tests/scripts/test_battle3d_engine_attack_shard_1.gd
            tests/scripts/test_battle3d_engine_attack_shard_2.gd
            tests/scripts/test_battle3d_engine_attack_shard_3.gd
            tests/scripts/test_battle3d_engine_attack_rejections.gd
            tests/scripts/test_battle3d_engine_attack_sync.gd
            tests/scripts/test_battle3d_enemy_turn_equivalence_shard_1.gd
            tests/scripts/test_battle3d_enemy_turn_equivalence_shard_2.gd
            tests/scripts/test_battle3d_enemy_turn_equivalence_shard_3.gd
            tests/scripts/test_battle3d_enemy_turn_locks.gd
            tests/scripts/test_battle3d_enemy_turn_default_layout.gd
            tests/scripts/test_battle3d_wait_equivalence.gd
            tests/scripts/test_battle3d_wait_default_round.gd
            tests/scripts/test_battle3d_wait_rejections.gd
            tests/scripts/test_battle3d_defend_equivalence.gd
            tests/scripts/test_battle3d_defend_default_round.gd
            tests/scripts/test_battle3d_defend_rejections.gd
            tests/scripts/test_battle3d_strategy_equivalence.gd
            tests/scripts/test_battle3d_strategy_default_round.gd
            tests/scripts/test_battle3d_strategy_rejections.gd
            tests/scripts/test_battle3d_strategy_mixed_log.gd
            tests/scripts/test_battle3d_reinforce_default_rounds.gd
            tests/scripts/test_battle3d_reinforce_blocking.gd
            tests/scripts/test_battle3d_reinforce_mixed_log.gd
            tests/scripts/test_battle3d_skill_equivalence_shard_1.gd
            tests/scripts/test_battle3d_skill_equivalence_shard_2.gd
            tests/scripts/test_battle3d_skill_equivalence_shard_3.gd
            tests/scripts/test_battle3d_skill_equivalence_shard_4.gd
            tests/scripts/test_battle3d_skill_default_round.gd
            tests/scripts/test_battle3d_skill_rejections.gd
            tests/scripts/test_battle3d_skill_mixed_log.gd
            tests/scripts/test_battle3d_enemy_skill_equivalence.gd
            tests/scripts/test_battle3d_enemy_skill_default_round.gd
            tests/scripts/test_battle3d_enemy_skill_mixed_log.gd
            tests/scripts/test_battle3d_movement_parity.gd
            tests/scripts/test_battle3d_modes.gd
            tests/scripts/test_battle3d_oblique_click.gd
            tests/scripts/alternating_battle_action_order_test.gd
            tests/scripts/test_single_side_exhaustion_turn_order.gd
          )
          for test_script in "${tests[@]}"; do
            echo "===== $test_script ====="
            timeout 120s godot --headless --path . --script "res://$test_script"
          done

      - name: Tech-tree regression tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/scripts/test_worldmap_domestic_tech_catalog_extraction.gd
            tests/scripts/test_worldmap_domestic_tech_research_rules_extraction.gd
            tests/scripts/test_worldmap_domestic_tech_research_service_extraction.gd
            tests/scripts/test_worldmap_domestic_tech_effect_provider_extraction.gd
            tests/scripts/test_worldmap_domestic_tech_tree_presentation_extraction.gd
            tests/scripts/test_worldmap_domestic_tech_completion_presentation_extraction.gd
          )
          for test_script in "${tests[@]}"; do
            echo "===== $test_script ====="
            timeout 120s godot --headless --path . --script "res://$test_script"
          done

      - name: Military regression tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/scripts/test_worldmap_military_controller_extraction.gd
            tests/scripts/test_worldmap_enemy_warfare_service_extraction.gd
            tests/scripts/test_worldmap_battle_context_service_extraction.gd
            tests/scripts/test_worldmap_battle_result_service_extraction.gd
            tests/scripts/test_worldmap_battle_settlement_applier_extraction.gd
            tests/scripts/test_worldmap_t03_strategic_battle_transaction_extraction.gd
            tests/scripts/test_worldmap_t03_battle_presentation_extraction.gd
            tests/scripts/test_worldmap_player_attack_deployment_service_extraction.gd
            tests/scripts/test_worldmap_troop_rebalance_service_extraction.gd
            tests/scripts/test_worldmap_wounded_recovery_service_extraction.gd
          )
          for test_script in "${tests[@]}"; do
            echo "===== $test_script ====="
            timeout 120s godot --headless --path . --script "res://$test_script"
          done

      - name: Diplomacy Trade Spy regression tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/scripts/test_worldmap_diplomacy_routing.gd
            tests/scripts/test_worldmap_diplomacy_controller_extraction.gd
            tests/scripts/test_worldmap_diplomacy_validation_extraction.gd
            tests/scripts/test_worldmap_diplomacy_mutation_extraction.gd
            tests/scripts/test_worldmap_diplomacy_state_extraction.gd
            tests/scripts/test_worldmap_diplomacy_alliance_extraction.gd
            tests/scripts/test_worldmap_trade_routing.gd
            tests/scripts/test_worldmap_trade_controller_extraction.gd
            tests/scripts/test_worldmap_trade_automation_extraction.gd
            tests/scripts/test_worldmap_internal_trade_transfer_extraction.gd
            tests/scripts/test_worldmap_spy_routing.gd
            tests/scripts/test_worldmap_spy_controller_extraction.gd
          )
          for test_script in "${tests[@]}"; do
            echo "===== $test_script ====="
            timeout 120s godot --headless --path . --script "res://$test_script"
          done

      - name: Project parse and WorldMap/Battle Main load
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --quit-after 2
          cat > tests/_ci_worldmap_scene_load.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              var packed := load("res://WorldMap.tscn") as PackedScene
              if packed == null:
                  push_error("[CI_WORLDMAP_LOAD] failed to load WorldMap.tscn")
                  quit(1)
                  return
              var instance := packed.instantiate()
              if instance == null:
                  push_error("[CI_WORLDMAP_LOAD] failed to instantiate WorldMap.tscn")
                  quit(1)
                  return
              print("[CI_WORLDMAP_LOAD] PASS")
              instance.free()
              quit(0)
          GDSCRIPT
          timeout 120s godot --headless --path . --script res://tests/_ci_worldmap_scene_load.gd
          rm tests/_ci_worldmap_scene_load.gd
          cat > tests/_ci_battle_main_scene_load.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              var packed := load("res://scenes/battle/Battle_Main.tscn") as PackedScene
              if packed == null:
                  push_error("[CI_BATTLE_MAIN_LOAD] failed to load Battle_Main.tscn")
                  quit(1)
                  return
              var instance := packed.instantiate()
              if instance == null:
                  push_error("[CI_BATTLE_MAIN_LOAD] failed to instantiate Battle_Main.tscn")
                  quit(1)
                  return
              print("[CI_BATTLE_MAIN_LOAD] PASS")
              instance.free()
              quit(0)
          GDSCRIPT
          timeout 120s godot --headless --path . --script res://tests/_ci_battle_main_scene_load.gd
          rm tests/_ci_battle_main_scene_load.gd
          cat > tests/_ci_imjin_iso_scene_load.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              var packed := load("res://tests/scenes/Battle_UI_Production_Imjin_IsoMovement_Test.tscn") as PackedScene
              if packed == null:
                  push_error("[CI_IMJIN_ISO_LOAD] failed to load ISO scenario")
                  quit(1)
                  return
              var instance := packed.instantiate()
              if instance == null:
                  push_error("[CI_IMJIN_ISO_LOAD] failed to instantiate ISO scenario")
                  quit(1)
                  return
              print("[CI_IMJIN_ISO_LOAD] PASS")
              instance.free()
              quit(0)
          GDSCRIPT
          timeout 120s godot --headless --path . --script res://tests/_ci_imjin_iso_scene_load.gd
          rm tests/_ci_imjin_iso_scene_load.gd

      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --short)"
          if [[ -n "$status" ]]; then
            echo "Working tree is not clean after verification:"
            printf '%s\n' "$status"
            exit 1
          fi
