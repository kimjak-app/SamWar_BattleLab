name: Apply T06-7 Hotfix1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-t06-7-hotfix1.yml'
      - 'tools/apply_t06_7_hotfix1.py'
      - 'tools/apply_t06_7_hotfix1_v2.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/hotfix-triggers/t06-7-hotfix1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t06-7-hotfix1
  cancel-in-progress: false

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hotfix
        run: python3 tools/apply_t06_7_hotfix1_v2.py

      - name: Validate hero design registry
        run: python3 tools/validate_hero_design_registry.py

      - name: Validate five-unit assignment
        run: python3 tools/validate_hero_five_unit_assignment.py

      - name: Validate battle profile integration
        run: python3 tools/validate_hero_battle_profile_integration.py

      - name: Validate runtime authority
        run: python3 tools/validate_hero_runtime_authority.py

      - name: Capture T06-7 validator diagnostics
        run: |
          set +e
          python3 tools/validate_t06_t07_playable_transaction.py > t06-validator.log 2>&1
          status=$?
          echo "$status" > t06-validator.status
          cat t06-validator.log
          exit 0

      - name: Upload validator diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: t06-validator-diagnostics
          path: |
            t06-validator.log
            t06-validator.status

      - name: Enforce T06-7 validator result
        run: test "$(cat t06-validator.status)" = "0"

      - name: Check diff
        run: git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: restore original T06-7 momentum contract"
          git push origin HEAD:main
