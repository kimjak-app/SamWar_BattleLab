name: Audit T06-7 Skill Range

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/hotfix-triggers/t06-7-skill-range-audit'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Print unique skill range functions
        run: |
          FILE=scripts/battle_web_import_test.gd
          grep -n "func _.*unique_skill.*range\|func _.*unique_skill.*overlay\|PHASE_UNIQUE_SKILL_TARGET_SELECT\|pending_unique_skill_plan" "$FILE" || true
          for N in $(grep -n "func _.*unique_skill.*range\|func _.*unique_skill.*overlay\|func _on_unique_skill_button_pressed\|func _begin_unique_skill" "$FILE" | cut -d: -f1); do
            START=$((N-8)); END=$((N+90));
            echo "===== lines $START-$END =====";
            sed -n "${START},${END}p" "$FILE";
          done
