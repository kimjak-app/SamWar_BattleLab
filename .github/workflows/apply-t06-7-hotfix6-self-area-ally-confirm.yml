name: Apply T06-7 Hotfix6 Self Area Ally Confirm

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/hotfix-triggers/t06-7-hotfix6-self-area-ally-confirm'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply self-area ally confirmation fix
        run: python3 tools/apply_t06_7_hotfix6_self_area_ally_confirm.py
      - name: Validate contracts
        run: |
          python3 tools/validate_t06_t07_playable_transaction.py
          git diff --check
      - name: Verify Reform Order interaction contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('scripts/battle_web_import_test.gd').read_text(encoding='utf-8')
          assert 'return ["self", "self_area_enemy", "enemy_adjacent"].has' in text
          assert 'if target_mode == "self_area":' in text
          assert 'get_unit_grid_distance(caster_state, unit_state) <= radius' in text
          assert 'if target_mode == "ally_area" or target_mode == "self_area":' in text
          assert 'display_range = maxi(int(skill_data.get("radius", 0)), 0)' in text
          print('Reform Order range + ally click confirmation contract PASS')
          PY
      - name: Godot parse check
        run: |
          if command -v godot >/dev/null 2>&1; then
            godot --headless --path . --editor --quit
          else
            echo 'Godot unavailable on runner; user F5 QA required.'
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm self-area skills from any ally in radius"
          git push origin HEAD:main
