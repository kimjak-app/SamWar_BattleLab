name: Apply T06-7 Hotfix4 Self Area Range

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/hotfix-triggers/t06-7-hotfix4-self-area-range'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply self-area range overlay fix
        run: python3 tools/apply_t06_7_hotfix4_self_area_range_overlay.py
      - name: Validate contracts
        run: |
          python3 tools/validate_t06_t07_playable_transaction.py
          python3 tools/validate_hero_design_registry.py
          git diff --check
      - name: Verify Yi Sun-sin area resolver contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/heroes/generated/hero_unique_skills.json').read_text(encoding='utf-8'))
          skill=next(s for s in data['skills'] if s['hero_id']=='yi_sun_sin')
          assert skill['target_mode']=='enemy_area'
          assert skill['radius']==3
          text=Path('scripts/battle/battle_skill_resolver.gd').read_text(encoding='utf-8')
          assert 'elif target_mode == "enemy_area"' in text
          assert '_distance(primary_target, unit) <= radius' in text
          assert 'for target in affected:' in text
          print('Yi Sun-sin enemy-area all-target resolver contract PASS')
          PY
      - name: Godot parse check
        run: |
          if command -v godot >/dev/null 2>&1; then
            godot --headless --path . --editor --quit
          else
            echo 'Godot unavailable on runner; user F5 QA required.'
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show self-area unique skill effect radius"
          git push origin HEAD:main
