name: Verify WorldMap3D
on:
  push:
    branches: [integration/p1-engine-core-20261019, "feature/**"]
    paths:
      - "worldmap3d/**"
      - "scripts/worldmap/map3d/**"
      - "WorldMap3D_*.tscn"
      - "tests/scripts/test_worldmap3d_*.gd"
      - "scripts/worldmap_city_marker.gd"
      - "WorldMap.tscn"
      - ".github/workflows/verify-worldmap3d.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-worldmap3d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worldmap3d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true          # 초기: 실패해도 작업을 막지 않음 (안정되면 false로)
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with: { version: 4.6.2, use-dotnet: false, include-templates: false }
      - uses: actions/cache@v4
        with:
          path: .godot/imported
          key: wm3d-import-4.6.2-${{ hashFiles('worldmap3d/**/*.import', 'worldmap3d/**/textures/**') }}
      - name: Import (3D 포함)
        run: timeout 1800s godot --headless --editor --path . --import
      - name: WorldMap3D tests
        shell: bash
        run: |
          shopt -s nullglob                     # 클코치 보강: 테스트 파일이 아직 없으면 건너뜀
          tests=(tests/scripts/test_worldmap3d_*.gd)
          if [ ${#tests[@]} -eq 0 ]; then echo "no worldmap3d tests yet"; exit 0; fi
          for t in "${tests[@]}"; do
            timeout 600s godot --headless --path . --script "res://$t"
          done
      - name: WorldMap3D_Test scene load
        shell: bash
        run: |
          if [ ! -f tests/scripts/ci_worldmap3d_scene_load.gd ]; then echo "no scene-load script yet"; exit 0; fi   # 클코치 보강
          timeout 300s godot --headless --path . --script res://tests/scripts/ci_worldmap3d_scene_load.gd
      - name: Diff check
        run: git diff --check && test -z "$(git status --short)"
