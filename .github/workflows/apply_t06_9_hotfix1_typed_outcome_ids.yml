name: Apply T06-9 Hotfix1 Typed Outcome IDs

on:
  push:
    branches: [main]
    paths:
      - '.github/hotfix-triggers/t06-9-hotfix1-typed-outcome-ids'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply typed outcome ID fix
        run: python3 tools/apply_t06_9_hotfix1_typed_outcome_ids.py
      - name: Validate contracts
        run: |
          python3 tools/validate_hero_design_registry.py
          python3 tools/validate_t06_t07_playable_transaction.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path('scripts/worldmap/worldmap_main.gd').read_text(encoding='utf-8')
          assert 'attacker_general_ids = attacker_hero_outcomes.keys()' not in text
          assert 'attacker_general_ids.append(fallback_hero_id)' in text
          assert '_apply_explicit_battle_hero_outcomes' in text
          print('T06-9-hotfix1 typed IDs PASS')
          PY
          git diff --check
      - name: Godot parse check
        run: |
          if command -v godot >/dev/null 2>&1; then
            godot --headless --path . --editor --quit
          else
            echo 'Godot unavailable on runner; user F5 QA required.'
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve typed hero outcome ID fallback"
          git push origin HEAD:main
