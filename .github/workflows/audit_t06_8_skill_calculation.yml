name: Audit T06-8 Skill Calculation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/hotfix-triggers/t06-8-skill-calculation-audit'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build calculation audit artifact
        run: |
          mkdir -p audit
          cp data/heroes/generated/hero_unique_skills.json audit/
          cp scripts/battle/battle_skill_resolver.gd audit/
          grep -R -n "class_name BattleUnitState\|func apply_status_effect\|func has_status_effect\|status_effect" scripts | head -500 > audit/status_locations.txt || true
          grep -n "func _apply_unique_skill_effect\|pending_unique_skill_plan\|match command_type\|\"damage\":\|\"status\":\|\"heal\":\|\"cleanse\":\|\"momentum\":\|\"move\":" scripts/battle_web_import_test.gd > audit/runtime_locations.txt || true
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          data=json.loads(Path('data/heroes/generated/hero_unique_skills.json').read_text(encoding='utf-8'))
          resolver=Path('scripts/battle/battle_skill_resolver.gd').read_text(encoding='utf-8')
          rows=[]
          for s in data['skills']:
              rows.append('\t'.join(str(s.get(k,'')) for k in ['hero_id','display_name','effect_type','target_mode','range','radius','power','duration_turns','description']))
          Path('audit/skills.tsv').write_text('hero_id\tname\teffect_type\ttarget_mode\trange\tradius\tpower\tduration\tdescription\n'+'\n'.join(rows),encoding='utf-8')
          effects=sorted({s['effect_type'] for s in data['skills']})
          Path('audit/effect_types.txt').write_text('\n'.join(effects),encoding='utf-8')
          print('skills',len(data['skills']),'effects',len(effects))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t06-8-skill-calculation-audit
          path: audit
