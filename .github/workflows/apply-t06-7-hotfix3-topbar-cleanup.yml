name: Apply T06-7 Hotfix3 Topbar Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/hotfix-triggers/t06-7-hotfix3-topbar-cleanup'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply targeted topbar cleanup
        run: python3 tools/apply_t06_7_hotfix3_topbar_cleanup.py
      - name: Validate contracts
        run: |
          python3 tools/validate_t06_t07_playable_transaction.py
          git diff --check
      - name: Godot parse check
        run: |
          if command -v godot >/dev/null 2>&1; then
            godot --headless --path . --editor --quit
          else
            echo 'Godot unavailable on runner; user F5 QA required.'
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep center momentum HUD and clear legacy topbar backgrounds"
          git push origin HEAD:main
