name: Apply T06-7 Hotfix1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-t06-7-hotfix1.yml'
      - 'tools/apply_t06_7_hotfix1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hotfix
        run: python3 tools/apply_t06_7_hotfix1.py

      - name: Validate Python contracts
        run: |
          python3 tools/validate_hero_design_registry.py
          python3 tools/validate_hero_five_unit_assignment.py
          python3 tools/validate_hero_battle_profile_integration.py
          python3 tools/validate_hero_runtime_authority.py
          python3 tools/validate_t06_t07_playable_transaction.py

      - name: Check diff
        run: git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: restore original T06-7 momentum contract"
          git push origin main
