name: One-shot WorldMap legacy action cleanup

on:
  push:
    branches:
      - integration/worldmap-iso-sfx-20260912
    paths:
      - .github/workflows/worldmap-legacy-action-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/worldmap-iso-sfx-20260912
          fetch-depth: 0

      - name: Remove legacy action execution from WorldMap main
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          main_path = root / 'scripts/worldmap/worldmap_main.gd'
          coordinator_path = root / 'scripts/worldmap/actions/worldmap_action_coordinator.gd'
          trade_path = root / 'scripts/worldmap/actions/trade_action_service.gd'
          validator_path = root / 'tools/validate_worldmap_contextual_action_transaction.py'

          def function_matches(text: str, name: str):
              pattern = re.compile(rf'(?ms)^func {re.escape(name)}\b.*?(?=^func |\Z)')
              return list(pattern.finditer(text))

          def replace_func(text: str, name: str, replacement: str) -> str:
              matches = function_matches(text, name)
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected exactly one function, found {len(matches)}')
              start, end = matches[0].span()
              suffix = '\n\n\n' if replacement.strip() else ''
              return text[:start] + replacement.rstrip() + suffix + text[end:]

          def replace_func_if_present(text: str, name: str, replacement: str) -> tuple[str, bool]:
              matches = function_matches(text, name)
              if len(matches) > 1:
                  raise SystemExit(f'{name}: expected zero or one function, found {len(matches)}')
              if not matches:
                  print(f'[cleanup] {name}: already extracted from worldmap_main.gd')
                  return text, False
              start, end = matches[0].span()
              suffix = '\n\n\n' if replacement.strip() else ''
              print(f'[cleanup] {name}: replacing legacy body with compatibility shim')
              return text[:start] + replacement.rstrip() + suffix + text[end:], True

          main = main_path.read_text(encoding='utf-8')
          coordinator = coordinator_path.read_text(encoding='utf-8')
          trade = trade_path.read_text(encoding='utf-8')

          main_complete = '''func complete_contextual_worldmap_action(action_type: String, action_id: String, target_city_id: String) -> Dictionary:
          \tif _contextual_action_coordinator == null:
          \t\treturn {"ok": false, "success": false, "message": "도시 행동 코디네이터를 찾을 수 없습니다."}
          \treturn _contextual_action_coordinator.complete(
          \t\taction_type,
          \t\taction_id,
          \t\ttarget_city_id
          \t)'''

          diplomacy_shim = '''func _apply_diplomacy_action(action_id: String, target_city_id: String = "") -> Dictionary:
          \tif _contextual_action_coordinator == null:
          \t\treturn {"ok": false, "success": false, "reason": "coordinator_unavailable", "message": "외교 행동 코디네이터를 찾을 수 없습니다."}
          \treturn _contextual_action_coordinator.execute_now("diplomacy", action_id, target_city_id)'''

          spy_shim = '''func _apply_spy_action(action_id: String, target_city_id: String = "") -> Dictionary:
          \tif _contextual_action_coordinator == null:
          \t\treturn {"ok": false, "success": false, "reason": "coordinator_unavailable", "message": "첩보 행동 코디네이터를 찾을 수 없습니다."}
          \treturn _contextual_action_coordinator.execute_now("spy", action_id, target_city_id)'''

          trade_shim = '''func _execute_external_manual_trade_order(order: Dictionary) -> Dictionary:
          \tif _contextual_action_coordinator == null:
          \t\treturn {"ok": false, "success": false, "reason": "coordinator_unavailable", "message": "교역 행동 코디네이터를 찾을 수 없습니다."}
          \treturn _contextual_action_coordinator.execute_trade_order(order)'''

          main = replace_func(main, 'complete_contextual_worldmap_action', main_complete)
          main = replace_func(main, '_execute_contextual_worldmap_action', '')
          main, _ = replace_func_if_present(main, '_apply_diplomacy_action', diplomacy_shim)
          main, _ = replace_func_if_present(main, '_apply_spy_action', spy_shim)
          main, _ = replace_func_if_present(main, '_execute_external_manual_trade_order', trade_shim)
          main_path.write_text(main, encoding='utf-8')

          coordinator_complete = '''func complete(
          \taction_type: String,
          \taction_id: String,
          \ttarget_city_id: String
          ) -> Dictionary:
          \tif _resolving or not _pending_presentation:
          \t\treturn _failure("not_pending", "실행 대기 중인 도시 행동이 없습니다.")
          \tif not _matches(action_type, target_city_id):
          \t\tvar changed_result := _failure("context_changed", "도시 행동 대상이 변경되었습니다.")
          \t\tresolve_without_video(_action_type, changed_result)
          \t\treturn changed_result

          \t_resolving = true
          \t_pending_presentation = false
          \tvar completed_type := _action_type
          \tvar completed_target := _target_city_id
          \tvar completed_source := _source_city_id
          \tvar raw_result: Variant = _execute_domain_action(
          \t\tcompleted_type,
          \t\taction_id,
          \t\tcompleted_target,
          \t\tcompleted_source
          \t)
          \tvar result: Dictionary = raw_result if raw_result is Dictionary else _failure(
          \t\t"invalid_result",
          \t\t"도시 행동 결과를 처리할 수 없습니다."
          \t)
          \t_clear_after_resolution()
          \taction_resolved.emit(completed_type, result)
          \treturn result


          func execute_now(
          \taction_type: String,
          \taction_id: String,
          \ttarget_city_id: String = "",
          \tsource_city_id: String = ""
          ) -> Dictionary:
          \tvar normalized_type := action_type.strip_edges().to_lower()
          \tif not VALID_ACTION_TYPES.has(normalized_type):
          \t\treturn _failure("unsupported_action", "지원하지 않는 도시 행동입니다.")
          \tvar raw_result: Variant = _execute_domain_action(
          \t\tnormalized_type,
          \t\taction_id,
          \t\ttarget_city_id.strip_edges(),
          \t\tsource_city_id.strip_edges()
          \t)
          \treturn raw_result if raw_result is Dictionary else _failure(
          \t\t"invalid_result",
          \t\t"도시 행동 결과를 처리할 수 없습니다."
          \t)


          func execute_trade_order(order: Dictionary) -> Dictionary:
          \treturn _trade_service.execute_order(get_parent(), order)'''

          coordinator_domain = '''func _execute_domain_action(
          \taction_type: String,
          \taction_id: String,
          \ttarget_city_id: String,
          \tsource_city_id: String
          ) -> Variant:
          \tvar host := get_parent()
          \tmatch action_type:
          \t\t"diplomacy":
          \t\t\treturn _diplomacy_service.execute(host, action_id, target_city_id, source_city_id)
          \t\t"spy":
          \t\t\treturn _spy_service.execute(host, action_id, target_city_id, source_city_id)
          \t\t"trade":
          \t\t\treturn _trade_service.execute(host, action_id, target_city_id, source_city_id)
          \treturn _failure("unsupported_action", "지원하지 않는 도시 행동입니다.")'''

          coordinator = replace_func(coordinator, 'complete', coordinator_complete)
          coordinator = replace_func(coordinator, '_execute_domain_action', coordinator_domain)
          coordinator_path.write_text(coordinator, encoding='utf-8')

          if 'var result := _execute_order(host, order)' not in trade:
              raise SystemExit('trade service execute call changed unexpectedly')
          if 'func _execute_order(host: Object, order: Dictionary) -> Dictionary:' not in trade:
              raise SystemExit('trade service core function changed unexpectedly')
          trade = trade.replace('var result := _execute_order(host, order)', 'var result := execute_order(host, order)', 1)
          trade = trade.replace('func _execute_order(host: Object, order: Dictionary) -> Dictionary:', 'func execute_order(host: Object, order: Dictionary) -> Dictionary:', 1)
          trade_path.write_text(trade, encoding='utf-8')

          validator = r'''#!/usr/bin/env python3
          """Static contract checks for service-owned WorldMap contextual actions."""

          from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parents[1]

          def read(relative_path: str) -> str:
              return (ROOT / relative_path).read_text(encoding="utf-8")

          def require(source: str, token: str, label: str) -> None:
              if token not in source:
                  raise AssertionError(f"missing {label}: {token}")

          def forbid(source: str, token: str, label: str) -> None:
              if token in source:
                  raise AssertionError(f"forbidden {label}: {token}")

          def function_blocks(source: str, name: str):
              pattern = re.compile(rf"(?ms)^func {re.escape(name)}\b.*?(?=^func |\Z)")
              return [match.group(0) for match in pattern.finditer(source)]

          def function_block(source: str, name: str) -> str:
              blocks = function_blocks(source, name)
              if len(blocks) != 1:
                  raise AssertionError(f"expected one {name}, found {len(blocks)}")
              return blocks[0]

          def validate_optional_shim(source: str, name: str, route_token: str, forbidden_tokens: tuple[str, ...]) -> None:
              blocks = function_blocks(source, name)
              if len(blocks) > 1:
                  raise AssertionError(f"expected zero or one {name}, found {len(blocks)}")
              if not blocks:
                  if re.search(rf"\b{re.escape(name)}\s*\(", source):
                      raise AssertionError(f"dangling legacy call without shim: {name}")
                  return
              block = blocks[0]
              require(block, route_token, f"{name} compatibility shim")
              for token in forbidden_tokens:
                  forbid(block, token, f"legacy logic in {name} shim")

          def require_return_after_request(source: str, action_type: str) -> None:
              request = f'_request_contextual_worldmap_action_presentation("{action_type}", '
              position = source.find(request)
              if position < 0:
                  raise AssertionError(f"missing {action_type} presentation request")
              following_lines = source[position:].splitlines()[1:3]
              if not following_lines or following_lines[0].strip() != "return":
                  raise AssertionError(f"{action_type} must return immediately after requesting presentation")

          def main() -> None:
              coordinator = read("scripts/worldmap/actions/worldmap_action_coordinator.gd")
              diplomacy_service = read("scripts/worldmap/actions/diplomacy_action_service.gd")
              spy_service = read("scripts/worldmap/actions/spy_action_service.gd")
              trade_service = read("scripts/worldmap/actions/trade_action_service.gd")
              worldmap = read("scripts/worldmap/worldmap_main.gd")
              city_actions = read("scripts/worldmap/ui/worldmap_city_action_test_controller.gd")
              presentation = read("scripts/worldmap/ui/worldmap_action_presentation_controller.gd")

              for token in (
                  'const VALID_ACTION_TYPES := ["diplomacy", "spy", "trade"]',
                  "func request_presentation(",
                  "func complete(",
                  "func execute_now(",
                  "func execute_trade_order(",
                  "func _execute_domain_action(",
                  "return _diplomacy_service.execute(host, action_id, target_city_id, source_city_id)",
                  "return _spy_service.execute(host, action_id, target_city_id, source_city_id)",
                  "return _trade_service.execute(host, action_id, target_city_id, source_city_id)",
                  "return _trade_service.execute_order(get_parent(), order)",
              ):
                  require(coordinator, token, "coordinator service contract")
              forbid(coordinator, "fallback_execute_action", "legacy coordinator fallback")
              forbid(coordinator, "execute_action: Callable", "legacy coordinator callable")

              complete_bridge = function_block(worldmap, "complete_contextual_worldmap_action")
              forbid(worldmap, "func _execute_contextual_worldmap_action(", "legacy contextual dispatcher")
              forbid(complete_bridge, 'Callable(self, "_execute_contextual_worldmap_action")', "legacy complete callable")

              validate_optional_shim(worldmap, "_apply_diplomacy_action", '_contextual_action_coordinator.execute_now("diplomacy", action_id, target_city_id)', ("_apply_generic_resource_cost", "_adjust_faction_relation_score"))
              validate_optional_shim(worldmap, "_apply_spy_action", '_contextual_action_coordinator.execute_now("spy", action_id, target_city_id)', ("_validate_spy_action", "_gather_spy_info", "_apply_spy_wedge_action"))
              validate_optional_shim(worldmap, "_execute_external_manual_trade_order", '_contextual_action_coordinator.execute_trade_order(order)', ("_validate_external_manual_trade_execution", "_set_city_storage"))

              for token in ('host.call("_validate_diplomacy_action", action_id, target_city_id)', '"_apply_generic_resource_cost"', '"_adjust_faction_relation_score"'):
                  require(diplomacy_service, token, "diplomacy service orchestration")
              forbid(diplomacy_service, 'host.call("_apply_diplomacy_action"', "diplomacy monolith bridge")

              for token in ('host.call("_validate_spy_action", action_id, target_city_id)', '"_gather_spy_info"', '"_disrupt_city_public_support"', '"_disrupt_city_loyalty"', '"_instigate_revolt"', '"_apply_spy_wedge_action"'):
                  require(spy_service, token, "spy service orchestration")
              forbid(spy_service, 'host.call("_apply_spy_action"', "spy monolith bridge")

              for token in ("func execute_order(host: Object, order: Dictionary) -> Dictionary:", 'host.call("_validate_external_manual_trade_execution", order)', 'host.call("_build_external_manual_trade_execution_preview", order)', '"_set_city_storage"'):
                  require(trade_service, token, "trade service orchestration")
              forbid(trade_service, "func _execute_order(", "private legacy trade executor")
              forbid(trade_service, 'host.call("_execute_external_manual_trade_order"', "trade monolith bridge")

              for old_state in ("var _contextual_worldmap_action_type", "var _contextual_worldmap_action_target_city_id", "var _contextual_worldmap_action_source_city_id", "var _contextual_worldmap_action_pending"):
                  forbid(worldmap, old_state, "legacy main-owned contextual state")

              require_return_after_request(worldmap, "diplomacy")
              require_return_after_request(worldmap, "spy")
              require(city_actions, 'production_world_map.call(\n\t\t"open_contextual_worldmap_action",', "foreign-city production route")
              forbid(city_actions, "action_video_test_requested", "video-only city action route")
              forbid(presentation, "_video_test_only", "video-only presentation state")
              require(presentation, 'production_world_map.call("complete_contextual_worldmap_action", action_type, action_id, target_city_id)', "video completion route")

              print("PASS: WorldMap action execution is service-owned; main has no legacy execution body.")

          if __name__ == "__main__":
              main()
          '''
          validator_path.write_text(validator, encoding='utf-8')

          final_main = main_path.read_text(encoding='utf-8')
          if 'func _execute_contextual_worldmap_action(' in final_main:
              raise SystemExit('legacy contextual dispatcher still present')
          for name in ('_apply_diplomacy_action', '_apply_spy_action', '_execute_external_manual_trade_order'):
              defs = function_matches(final_main, name)
              if len(defs) > 1:
                  raise SystemExit(f'{name}: duplicate compatibility function')
              if not defs and re.search(rf'\b{re.escape(name)}\s*\(', final_main):
                  raise SystemExit(f'{name}: dangling legacy call remains without function')
          PY

      - name: Verify structural contracts
        shell: bash
        run: |
          git diff --check
          python tools/validate_worldmap_contextual_action_transaction.py
          python tools/validate_worldmap_to_battle_input_lifecycle.py

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/worldmap/worldmap_main.gd \
                  scripts/worldmap/actions/worldmap_action_coordinator.gd \
                  scripts/worldmap/actions/trade_action_service.gd \
                  tools/validate_worldmap_contextual_action_transaction.py
          git commit -m "Refactor worldmap legacy action shims"
          git push origin HEAD:integration/worldmap-iso-sfx-20260912
