            tools/validate_battle3d_edge_scroll.py
            tools/validate_battle3d_unit_markers.py
            tools/validate_battle3d_marker_look.py
            tools/validate_battle3d_panel_hud.py
            tools/validate_battle3d_panel_reach.py
            tools/validate_battle3d_roster_option.py
            tools/validate_t1_blocked_cells.py
            tools/validate_t2_forest_groves.py
            tools/validate_t3_blocked_all_paths.py
            tools/validate_battle3d_contract.py
            tools/validate_alternating_battle_action_order.py
            tools/validate_single_side_exhaustion_turn_order.py
          )
          for validator in "${validators[@]}"; do
            echo "===== $validator ====="
            python3 "$validator"
          done

      - name: C-track Godot tests
