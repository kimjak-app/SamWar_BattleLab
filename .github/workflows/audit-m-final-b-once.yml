# trigger: M-FINAL-B hub scan
name: Audit M-FINAL-B once

on:
  push:
    branches:
      - recovery/worldmap-iso-sfx-services-20260912
    paths:
      - .github/workflows/audit-m-final-b-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan worldmap main dead symbols
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          main_path = root / 'scripts/worldmap/worldmap_main.gd'
          main = main_path.read_text(encoding='utf-8')
          text_exts = {'.gd', '.tscn', '.tres', '.py', '.md', '.yml', '.yaml', '.json', '.cfg', '.godot'}
          files = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in text_exts:
                  continue
              try:
                  files.append((p, p.read_text(encoding='utf-8')))
              except UnicodeDecodeError:
                  pass

          lifecycle = {
              '_ready', '_process', '_physics_process', '_input', '_shortcut_input',
              '_unhandled_input', '_unhandled_key_input', '_notification', '_enter_tree',
              '_exit_tree', '_draw', '_get_configuration_warnings'
          }

          funcs = []
          for m in re.finditer(r'^func\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(', main, re.M):
              name = m.group(1)
              line = main.count('\n', 0, m.start()) + 1
              total = sum(text.count(name) for _, text in files)
              if name.startswith('_') and name not in lifecycle and total == 1:
                  funcs.append((line, name))

          consts = []
          for m in re.finditer(r'^const\s+([A-Z][A-Z0-9_]*)\b', main, re.M):
              name = m.group(1)
              line = main.count('\n', 0, m.start()) + 1
              total = sum(text.count(name) for _, text in files)
              if total == 1:
                  consts.append((line, name))

          print('=== PRIVATE FUNCTIONS WITH REPO-WIDE TEXT OCCURRENCE == 1 ===')
          for line, name in funcs:
              print(f'{line}: {name}')
          print(f'COUNT={len(funcs)}')
          print('=== CONSTANTS WITH REPO-WIDE TEXT OCCURRENCE == 1 ===')
          for line, name in consts:
              print(f'{line}: {name}')
          print(f'COUNT={len(consts)}')
          PY
