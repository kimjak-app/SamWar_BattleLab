name: Apply T06-8 Skill Calculation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/hotfix-triggers/t06-8-skill-calculation-apply'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply T06-8 calculation implementation
        run: |
          python3 tools/apply_t06_8_skill_calculation.py
          python3 tools/apply_t06_8_remove_hero_hardcodes.py
      - name: Validate existing contracts
        run: |
          python3 tools/validate_hero_design_registry.py
          python3 tools/validate_t06_t07_playable_transaction.py
          git diff --check
      - name: Validate T06-8 calculation contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('scripts/battle/battle_skill_resolver.gd').read_text(encoding='utf-8')
          b=Path('scripts/battle_web_import_test.gd').read_text(encoding='utf-8')
          required=[
            'deterministic_followup','advance_on_kill','ignore_defense',
            'accuracy_down','momentum_gain_up','momentum_gain_down',
            'flank_damage_up','flank_damage_taken_up','status_resist',
            'rout_resist','siege_attack_up',
            'if effect_type == "aoe_debuff" and not affected.is_empty()',
            'if effect_type == "control_field"',
          ]
          for token in required:
            assert token in r, token
          for token in ['_apply_resolver_advance_toward_target','status_resist','flank_damage_up','flank_damage_taken_up']:
            assert token in b, token
          print('T06-8 calculation contract PASS')
          PY
      - name: Godot parse check
        run: |
          if command -v godot >/dev/null 2>&1; then
            godot --headless --path . --editor --quit
          else
            echo 'Godot unavailable on runner; user F5 QA required.'
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply T06-8 unique skill battle calculations"
          git push origin HEAD:main
